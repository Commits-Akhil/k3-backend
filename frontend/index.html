<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cyber Lab</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
    >

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <header>

        <h1>Cyber Lab</h1>

        <div class="buttons">

            <button id="terminalButton">
                Terminal
            </button>

            <button id="guiButton">
                GUI
            </button>

        </div>

    </header>

    <main>

        <!-- TERMINAL -->

        <section
            id="terminalPanel"
            class="panel hidden"
        >

            <div class="panel-header">

                <span>Terminal</span>

                <span id="terminalStatus">
                    Disconnected
                </span>

            </div>

            <div id="terminal"></div>

        </section>


        <!-- GUI -->

        <section
            id="guiPanel"
            class="panel hidden"
        >

            <div class="panel-header">

                <span>Kali GUI</span>

                <span>noVNC</span>

            </div>

            <iframe
                id="guiFrame"
                src=""
                allow="clipboard-read; clipboard-write"
            ></iframe>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"
    ></script>

    <script src="/app.js"></script>

</body>

</html>
